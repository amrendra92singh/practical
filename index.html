<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject Files</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .box {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        h1 {
            margin-bottom: 20px;
        }

        select {
            padding: 10px;
            width: 100%;
            margin-top: 15px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            background: #00c853;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #009624;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>📚 Select Your Subject</h1>

        <select id="subject">
            <option value="">-- Choose Subject --</option>
            <option value="mf">Mathematical Finance</option>
            <option value="na">Numerical Analysis</option>
        </select>

        <button onclick="goToFile()">Open File</button>
    </div>

    <script>
        function goToFile() {
            const subject = document.getElementById("subject").value;

            if (subject === "mf") {
                window.location.href = "MF PRACTICAL.xlsx";
            } 
            else if (subject === "na") {
                window.location.href = "NA PRACTICAL.pdf";
            } 
            else {
                alert("Please select a subject first!");
            }
        }
    </script>

</body>
</html>

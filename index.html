<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Files</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #333;
        }
        .file-box {
            background: white;
            padding: 20px;
            margin: 20px auto;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        a {
            text-decoration: none;
            color: white;
            background: #007BFF;
            padding: 10px 15px;
            border-radius: 5px;
            display: inline-block;
            margin-top: 10px;
        }
        a:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <h1>📂 My Uploaded Files</h1>

    <div class="file-box">
        <h3>CA.nb File</h3>
        <a href="CA.nb" target="_blank">Open / Download</a>
    </div>

    <div class="file-box">
        <h3>CApdf.pdf</h3>
        <a href="CApdf.pdf" target="_blank">Open PDF</a>
    </div>

    <div class="file-box">
        <h3>CA_PRAC.txt</h3>
        <a href="CA_PRAC.txt" target="_blank">View Text File</a>
    </div>

</body>
</html>

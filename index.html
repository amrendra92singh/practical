<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaTeX Files</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
            text-align: center;
            color: white;
            padding: 50px;
        }
        h1 {
            margin-bottom: 40px;
        }
        .file-box {
            background: white;
            color: #333;
            padding: 20px;
            margin: 20px auto;
            width: 320px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        a {
            text-decoration: none;
            color: white;
            background: #28a745;
            padding: 10px 15px;
            border-radius: 6px;
            display: inline-block;
            margin-top: 10px;
        }
        a:hover {
            background: #1e7e34;
        }
    </style>
</head>
<body>

    <h1>📄 My LaTeX Files</h1>

    <div class="file-box">
        <h3>1to8.tex</h3>
        <a href="1to8.tex" target="_blank">Open / Download</a>
    </div>

    <div class="file-box">
        <h3>beamer.tex</h3>
        <a href="beamer.tex" target="_blank">Open / Download</a>
    </div>

    <div class="file-box">
        <h3>pstrick.tex</h3>
        <a href="pstrick.tex" target="_blank">Open / Download</a>
    </div>

</body>
</html>
